name: hobby_tracker
description: Hobby Tracker — PRM393 Lab 3 integrated phases 00–08
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: 2.6.1
  flutter_svg: 2.2.4
  go_router: 14.8.1
  firebase_core: 3.13.0
  firebase_auth: 5.5.3
  cloud_firestore: 5.6.7
  cloud_functions: 5.4.0
  image_picker: 1.2.0
  workmanager: 0.9.0+3
  google_sign_in: 6.3.0
  flutter_appauth: 12.1.0
  firebase_storage: 12.4.5
  firebase_messaging: 15.2.5
  firebase_analytics: 11.4.5
  firebase_crashlytics: 4.3.5
  firebase_remote_config: 5.4.3
  shared_preferences: 2.5.3
  url_launcher: 6.3.1
  pdf: 3.11.3
  printing: 5.14.2
  uuid: 4.5.1
  flutter_local_notifications: 19.0.0
  timezone: 0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/figma/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
